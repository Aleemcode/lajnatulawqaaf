<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lajnatul Awqaaf emblem" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="512" height="512" rx="112" fill="#123788"/>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- Eight-point Islamic star (two overlaid squares) -->
  <g transform="translate(256 256)">
    <rect x="-120" y="-120" width="240" height="240" rx="28" fill="#EFAC02" opacity="0.95"/>
    <rect x="-120" y="-120" width="240" height="240" rx="28" fill="#EFAC02" opacity="0.95" transform="rotate(45)"/>
    <circle r="96" fill="#123788"/>
    <!-- Crescent -->
    <path d="M 34 -66 A 78 78 0 1 0 34 66 A 62 62 0 1 1 34 -66 Z" fill="#03BDE3"/>
  </g>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A4CB8"/>
      <stop offset="1" stop-color="#0B245B"/>
    </linearGradient>
  </defs>
</svg>
